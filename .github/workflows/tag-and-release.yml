# SPDX-License-Identifier: Apache-2.0
# When run:
# * skips everything when HEAD is already released;
# * tags a new release based on main top of tree (at least a patch bump);
# * builds the source archive with git archive and uploads it;
# * publishes the release to the filmil registry and to the BCR.
#
# It runs by hand only for now; see the comment on `on:`.
name: Tag and Release


on:
  # Run by hand only, until the rules produce outputs (milestone M3).
  # Until then a release would publish an empty module to both registries.
  # Put the monthly schedule back then:
  #   schedule:
  #     - cron: '0 0 20 * *'
  workflow_dispatch:
    inputs:
      force_publish:
        description: >-
          Release and publish even when HEAD is already released. Bumps the
          patch version.
        type: boolean
        default: false
        required: false

jobs:
  # A release only happens when something was committed since the last tag.
  # Without this check a scheduled or repeated run would release the same
  # tree again under a new version. Every job below depends on its answer.
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and tags: `git describe` needs both, and the default
          # shallow checkout has neither.
          fetch-depth: 0
      - name: Look for commits since the last release
        id: changes
        run: |
          set -o errexit -o nounset -o pipefail
          if [ "${{ inputs.force_publish }}" = "true" ]; then
            echo "Forced publish requested; releasing."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          latest="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "${latest}" ]; then
            echo "No tag yet; releasing."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "$(git rev-list -n 1 "${latest}")" = "$(git rev-parse HEAD)" ]; then
            echo "HEAD is already released as ${latest}. Nothing to release."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "$(git rev-list --count "${latest}"..HEAD) commit(s) since ${latest}; releasing."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  # Every dependency must resolve from the published registries, the
  # filmil registry first and then the BCR, and no module may override
  # one: a release waits for that, before anything is tagged. It does not
  # wait for the BCR alone: hdlf_rules_kicad is in the filmil registry first,
  # and the BCR's review takes days (operator, 2026-11-01). Pull requests do
  # not wait (Test's bcr-ready job is advisory).
  bcr_ready:
    needs: check
    if: ${{ needs.check.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    container: buildpack-deps:bullseye-curl@sha256:7c8d79c31eb106cca055357456a2fa89b10fa20f254da6fe3eca937439696c62
    strategy:
      matrix:
        bazel: ["8.x", "9.x"]
    defaults:
      run:
        shell: bash
    # The same bazelisk as Test (test.yml); change both together.
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
      BAZELISK_VERSION: v1.29.0
      BAZELISK_SHA256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
    steps:
      - name: Install bazelisk
        run: |
          set -o errexit -o nounset -o pipefail
          curl -fsSL -o /usr/local/bin/bazel \
            "https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}/bazelisk-linux-amd64"
          echo "${BAZELISK_SHA256}  /usr/local/bin/bazel" | sha256sum -c -
          chmod +x /usr/local/bin/bazel

      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependencies resolve from the filmil registry and the BCR
        run: bazel --ignore_all_rc_files mod graph --registry=https://raw.githubusercontent.com/filmil/bazel-registry/main --registry=https://bcr.bazel.build > /dev/null

      - name: Integration dependencies resolve from the filmil registry and the BCR
        working-directory: integration
        run: bazel --ignore_all_rc_files mod graph --registry=https://raw.githubusercontent.com/filmil/bazel-registry/main --registry=https://bcr.bazel.build > /dev/null

      # An override in a root module bypasses the registry, so the checks
      # above pass with one; a published module must not have one. This
      # checks MODULE.bazel and integration/MODULE.bazel (all but its
      # local_path_override of hdlf_rules_fab).
      - name: The modules override no dependency
        run: |
          set -o errexit -o nounset -o pipefail
          bazel run //tools/nooverrides -- "${PWD}"
          bazel run //tools/nooverrides -- --allow_local_path=hdlf_rules_fab "${PWD}/integration"

  tag:
    needs: [check, bcr_ready]
    if: ${{ needs.check.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          # At least a patch bump, so commits such as `chore:` still release.
          # The `check` job above already stops a run on a HEAD that is
          # released, so this cannot release the same tree twice.
          default_bump: patch

  release:
    needs: tag
    if: ${{ needs.tag.outputs.tag_name != '' }}
    permissions:
      contents: write      # upload release files
      id-token: write      # attest provenance
      attestations: write  # attest provenance
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
      release_files: bazel_rules_fab-${{ needs.tag.outputs.tag_name }}.zip
      prerelease: false

  # `publish` needs `tag` and `release`, so a skipped `tag` skips it too;
  # the guard here additionally covers a `tag` job that ran but produced no tag.
  publish:
    needs: [tag, release]
    if: ${{ needs.tag.outputs.tag_name != '' }}
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
    secrets:
      BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}

  # The same release, published to the Bazel Central Registry.
  publish-bcr:
    needs: [tag, release]
    if: ${{ needs.tag.outputs.tag_name != '' }}
    uses: ./.github/workflows/publish-bcr.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
    secrets:
      BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
